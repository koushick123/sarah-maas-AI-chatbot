name: Build and Deploy to Digital Ocean VM

on:
  push:
    branches:
      - main   # or change to your deploy branch
    tags:
      - "v*.*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build & Push Docker image
      - name: Build and Push Docker image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          IMAGE_NAME=koushick123/sarah-maas-research-assistant
          VERSION=${GITHUB_REF#refs/tags/}
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:$VERSION .
          docker push $IMAGE_NAME:$VERSION

      # 4. Deploy on DigitalOcean VM via SSH
      - name: Deploy to Digital Ocean VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            TAG=${GITHUB_REF#refs/tags/}
      
            echo "Deploying image with tag: $TAG"
      
            docker pull koushick123/sarah-maas-research-assistant:$TAG
            docker stop research-assistant || true
            docker rm research-assistant || true
            docker run -d --name research-assistant -p 8000:8000 \
              koushick123/sarah-maas-research-assistant:$TAG
